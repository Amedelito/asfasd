name: Build KillFeed

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: mvn -B clean package

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: KillFeed
          path: target/KillFeed.jar

      - name: Publicar release (solo con tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/KillFeed.jar
